[project]
name = "rag-project"
version = "0.1.0"
description = "End-to-end document search and corrective RAG app using local ChromaDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "langchain",
    "langchain-chroma",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-tavily",
    "langchain-text-splitters",
    "langgraph",
    "langsmith",
    "chromadb",
    "openai",
    "pydantic",
    "pypdf",
    "pyperclip",
    "python-dotenv",
    "requests",
    "streamlit",
    "wikipedia",
]
